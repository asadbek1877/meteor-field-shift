<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TerraShift</title><meta name="description" content="See recent field conditions, rainfall forecast, and irrigation guidance.">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="current" data-title="page_title_current">
  <a class="skip-link" href="#main-content" data-t="skip_to_content"></a>
  <header class="top">
    <a class="brand" href="/" aria-label="TerraShift"><span class="logo" aria-hidden="true"></span><span><strong>TerraShift</strong><span class="sub" data-t="tagline"></span></span></a>
    <nav class="site-nav" data-t-aria="main_nav_label">
      <a href="/" data-page-link="home" data-t="nav_home"></a><a href="/rotations.html" data-page-link="rotations" data-t="nav_rotations"></a>
      <a href="/climate.html" data-page-link="climate" data-t="nav_climate"></a><a href="/crops.html" data-page-link="crops" data-t="nav_crops"></a>
      <a href="/current.html" data-page-link="current" data-t="nav_now"></a><a href="/sources.html" data-page-link="sources" data-t="nav_sources"></a>
    </nav>
    <div class="top-actions"><div id="chips" class="chips" aria-live="polite"></div>
      <div class="seg" role="group" data-t-aria="language_group"><button type="button" data-lang="uz">UZ</button><button type="button" data-lang="en">EN</button></div>
      <a class="btn ghost source-link" href="/sources.html" data-t="sources_btn"></a>
    </div>
  </header>
  <div id="warnings" class="warnings" aria-live="polite"></div>
  <p id="analysis-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <main class="page-main" id="main-content">
    <section id="week-card" class="card week" aria-labelledby="week-plan-title" hidden></section>
    <section class="card" id="now-card" aria-labelledby="now-heading">
      <div class="head"><h1 id="now-heading" data-t="now_title"></h1><span id="now-meta" class="muted small"></span></div>
      <div id="now-kpis" class="kpis"></div>
      <h2 id="forecast-title"></h2>
      <div class="chart" id="forecast-wrap"><canvas id="forecast-chart"></canvas></div>
      <p id="forecast-note" class="hint"></p><div id="week"></div><ul id="advice-now" class="advice"></ul>
    </section>
    <section class="card obs" id="obs-card" aria-labelledby="obs-heading" hidden>
      <div class="head"><h2 id="obs-heading" data-t="obs_title"></h2><span id="obs-status" class="muted small" role="status" aria-live="polite"></span></div>
      <p class="hint" data-t="obs_hint"></p>
      <div id="obs-kpis" class="kpis"></div>
      <div class="obs-charts">
        <div class="chart"><canvas id="obs-ndvi"></canvas></div>
        <div class="chart"><canvas id="obs-water"></canvas></div>
      </div>
      <ul id="obs-notes" class="advice"></ul>
    </section>
    <section class="card" id="water-card" aria-labelledby="water-heading">
      <h2 id="water-heading" data-t="water_title"></h2>
      <p class="hint" data-t="water_hint"></p>
      <form id="water-form" class="water-form">
        <label class="field"><span data-t="water_crop"></span><select id="w-crop" required></select></label>
        <label class="field"><span data-t="water_area"></span><input id="w-area" type="number" min="0.01" max="100000" step="0.01" inputmode="decimal" required></label>
        <label class="field"><span data-t="water_sow"></span><input id="w-sow" type="date"></label>
        <label class="field"><span data-t="water_last"></span><input id="w-last" type="date"></label>
        <button type="submit" id="w-go" class="btn primary" data-t="water_go"></button>
      </form>
      <p id="water-status" class="hint" role="status" aria-live="polite"></p>
      <div id="water-result" hidden>
        <p id="water-head" class="water-head"></p>
        <ul id="water-lines" class="advice"></ul>
        <div id="water-kpis" class="kpis"></div>
        <div class="chart"><canvas id="water-chart"></canvas></div>
        <div class="table-wrap" role="region" tabindex="0" data-t-aria="water_table_label"><table id="water-table"></table></div>
        <p class="hint" data-t="water_method"></p>
      </div>
    </section>
  </main>
  <script src="/vendor/chart.umd.min.js"></script><script src="/i18n.js"></script><script src="/app.js"></script>
</body>
</html>
