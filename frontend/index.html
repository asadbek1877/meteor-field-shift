<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TerraShift</title>
  <meta name="description" content="Compare crop rotations for your field with 35 years of NASA climate data.">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <strong>TerraShift</strong>
        <span class="sub" data-t="tagline"></span>
      </div>
    </div>
    <div class="top-actions">
      <div id="chips" class="chips" aria-live="polite"></div>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="uz">UZ</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" id="open-settings" class="btn ghost" data-t="sources_btn"></button>
    </div>
  </header>

  <div id="warnings" class="warnings" aria-live="polite"></div>

  <main class="layout">
    <aside class="side">
      <section class="card">
        <h2 data-t="field_title"></h2>
        <p class="hint" data-t="field_hint"></p>
        <div id="map" class="map" role="application" aria-label="Map"></div>
        <div class="row wrap">
          <button type="button" id="locate" class="btn primary" data-t="locate"></button>
          <span id="coords" class="mono muted"></span>
        </div>
        <p id="locate-msg" class="hint warn-text" hidden></p>
        <div id="presets" class="row wrap"></div>
        <label class="field">
          <span data-t="map_layer"></span>
          <select id="layer"></select>
        </label>
        <label class="field" id="opacity-row" hidden>
          <span data-t="layer_opacity"></span>
          <input type="range" id="opacity" min="20" max="100" value="70">
        </label>
      </section>

      <section class="card">
        <h2 data-t="passport_title"></h2>
        <label class="field">
          <span data-t="current_rotation"></span>
          <select id="current"></select>
        </label>
        <div id="builder" class="builder" hidden>
          <p class="hint" data-t="builder_hint"></p>
          <div id="builder-years"></div>
          <div class="row wrap">
            <button type="button" id="add-year" class="btn ghost" data-t="add_year"></button>
            <button type="button" id="remove-year" class="btn ghost" data-t="remove_year"></button>
          </div>
        </div>
        <label class="field">
          <span data-t="irrigation_method"></span>
          <select id="irrigation"></select>
        </label>
        <label class="field">
          <span data-t="soil_type"></span>
          <select id="soil"></select>
        </label>
        <p id="soil-note" class="hint"></p>
      </section>

      <section class="card">
        <h2 data-t="priorities_title"></h2>
        <p class="hint" data-t="priorities_hint"></p>
        <div id="sliders"></div>
      </section>
    </aside>

    <div class="content" id="content">
      <section class="card verdict" id="verdict-card">
        <div class="eyebrow" data-t="verdict_eyebrow"></div>
        <h1 id="verdict"></h1>
        <p id="verdict-sub" class="lead"></p>
        <ul id="advice-top" class="advice"></ul>
      </section>

      <section class="card" id="rotations-card">
        <div class="head">
          <h2 data-t="rotations_title"></h2>
          <span id="rotations-meta" class="muted small"></span>
        </div>
        <p class="hint" data-t="rotations_hint"></p>
        <div id="rotations"></div>
        <div class="legend-line small muted">
          <span class="swatch band"></span><span data-t="legend_band"></span>
          <span class="swatch mark"></span><span data-t="legend_mark"></span>
        </div>
      </section>

      <section class="card" id="climate-card">
        <div class="head">
          <h2 data-t="climate_title"></h2>
          <span id="climate-meta" class="muted small"></span>
        </div>
        <div id="kpis" class="kpis"></div>
        <div class="chart-head">
          <label class="field inline">
            <span data-t="metric"></span>
            <select id="metric"></select>
          </label>
        </div>
        <div class="chart tall"><canvas id="annual-chart"></canvas></div>
        <p class="hint" data-t="projection_note"></p>
        <h3 data-t="monthly_title"></h3>
        <div class="legend-line small">
          <span class="swatch s1"></span><span id="legend-base"></span>
          <span class="swatch s2"></span><span id="legend-recent"></span>
        </div>
        <div class="multiples">
          <figure><figcaption data-t="m_temp"></figcaption><div class="chart"><canvas id="m-t"></canvas></div></figure>
          <figure><figcaption data-t="m_rain"></figcaption><div class="chart"><canvas id="m-rain"></canvas></div></figure>
          <figure><figcaption data-t="m_et0"></figcaption><div class="chart"><canvas id="m-et0"></canvas></div></figure>
        </div>
        <ul id="advice-climate" class="advice"></ul>
      </section>

      <section class="card" id="crops-card">
        <h2 data-t="crops_title"></h2>
        <p class="hint" data-t="crops_hint"></p>
        <div class="table-wrap"><table id="crops"></table></div>
        <ul id="advice-crops" class="advice"></ul>
      </section>

      <section class="card" id="now-card">
        <div class="head">
          <h2 data-t="now_title"></h2>
          <span id="now-meta" class="muted small"></span>
        </div>
        <div id="now-kpis" class="kpis"></div>
        <h3 id="forecast-title"></h3>
        <div class="chart" id="forecast-wrap"><canvas id="forecast-chart"></canvas></div>
        <p id="forecast-note" class="hint"></p>
        <div id="week"></div>
        <ul id="advice-now" class="advice"></ul>
      </section>

      <section class="card" id="sources-card">
        <h2 data-t="sources_title"></h2>
        <div id="datasets"></div>
        <h3 data-t="method_title"></h3>
        <ul id="methods" class="plain"></ul>
        <p id="disclaimer" class="hint"></p>
      </section>
    </div>
  </main>

  <dialog id="settings">
    <form method="dialog" class="dialog-head">
      <h2 data-t="settings_title"></h2>
      <button class="btn ghost" data-t="close"></button>
    </form>
    <p class="hint" data-t="settings_hint"></p>
    <div id="providers"></div>
    <button type="button" id="refresh-providers" class="btn ghost" data-t="recheck"></button>
    <h3 data-t="add_provider"></h3>
    <p class="hint" id="edit-note"></p>
    <form id="provider-form" class="form-grid">
      <label class="field"><span data-t="admin_token"></span><input type="password" id="admin-token" autocomplete="off"></label>
      <label class="field"><span data-t="p_id"></span><input id="p-id" required pattern="[a-z0-9_]{3,32}" placeholder="smap_layer"></label>
      <label class="field"><span data-t="p_name"></span><input id="p-name" required placeholder="SMAP soil moisture"></label>
      <label class="field"><span data-t="p_kind"></span>
        <select id="p-kind"><option value="layers" data-t="kind_layers"></option><option value="json" data-t="kind_json"></option></select>
      </label>
      <label class="field wide"><span data-t="p_url"></span><input id="p-url" required placeholder="https://.../{z}/{y}/{x}.png"></label>
      <button class="btn primary" data-t="add"></button>
    </form>
    <p id="provider-msg" class="hint" aria-live="polite"></p>
  </dialog>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
