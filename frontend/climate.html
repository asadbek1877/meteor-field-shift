<!doctype html>
<html lang="uz" class="dash-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iqlim | Dalaviy</title>
  <meta name="description" content="Climate trends for your region from 35 years of NASA POWER data, with a trend projection to 2040.">
  <script src="/transitions.js?v=20261116"></script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-latin.woff2" crossorigin>
  <link rel="preload" as="image" href="/media/climate-poster.webp" fetchpriority="high">
  <link rel="stylesheet" href="/style.css?v=20261116">
  <link rel="stylesheet" href="/field.css?v=20261116">
  <link rel="stylesheet" href="/climate.css?v=20261116">
  <link rel="stylesheet" href="/glass.css?v=20261116">
  <link rel="stylesheet" href="/transitions.css?v=20261116">
  <script type="speculationrules">{"prefetch": [{"where": {"selector_matches": ".dash-nav a"}, "eagerness": "moderate"}]}</script>
</head>
<body data-page="climate" data-title="page_title_climate" data-providers="nasa_power,open_meteo">
  <a class="skip-link" href="#main-content" data-t="skip_to_content"></a>

  <!-- Climate (Iqlim): 35 years of NASA POWER for the chosen region, a trend continued to 2040.
       Shared header and icons: shell.js. Data: app.js (renderClimatePage). Behaviour: field.js. Styles: field.css + climate.css. -->
  <div id="app" class="app-shell dash clim" data-in-root>
    <div data-shell-sprite></div>

    <div class="dash-bg" aria-hidden="true">
      <div class="dash-video-box clim-video-box">
        <video class="dash-video" id="dash-video" data-src="/media/climate.mp4" poster="/media/climate-poster.webp"
          muted loop playsinline preload="none" disablepictureinpicture disableremoteplayback tabindex="-1"></video>
      </div>
      <div class="dash-atmos clim-atmos"></div>
      <div class="dash-vignette"></div>
    </div>

    <header data-shell-header></header>
    <script src="/shell.js?v=20261116"></script>
    <p id="analysis-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>

    <main class="clim-main" id="main-content">
      <!-- hero: heading, today's forecast, five climate shifts -->
      <section class="clim-hero" aria-labelledby="clim-title">
        <div class="clim-intro">
          <p class="dash-eyebrow" data-in style="--i: 1"><span class="dash-slashes" aria-hidden="true">///</span><span data-t="clim_eyebrow"></span></p>
          <h1 class="clim-title" id="clim-title" data-in style="--i: 2"><span data-t="clim_title_a"></span><span class="dash-accent" data-t="clim_title_b"></span></h1>
          <p class="clim-lead" id="clim-sub" data-in style="--i: 3"></p>
        </div>
        <dl class="clim-now" id="clim-now" data-in style="--i: 4" hidden></dl>
        <ul class="clim-metrics" id="clim-metrics" data-t-title="clim_metrics_note">
          <li class="cmetric tone-red" data-in style="--i: 4"><span class="cm-ico"><svg><use href="#i-thermo"/></svg></span>
            <span class="cm-txt"><b id="cm-t">–</b><span data-t="k_t_mean"></span></span><span class="cm-arrow" id="cm-t-dir" aria-hidden="true"></span></li>
          <li class="cmetric tone-cyan" data-in style="--i: 5"><span class="cm-ico"><svg><use href="#i-drop"/></svg></span>
            <span class="cm-txt"><b id="cm-p">–</b><span data-t="k_precip_mm"></span></span><span class="cm-arrow" id="cm-p-dir" aria-hidden="true"></span></li>
          <li class="cmetric tone-green" data-in style="--i: 6"><span class="cm-ico"><svg><use href="#i-leaf"/></svg></span>
            <span class="cm-txt"><b id="cm-et">–</b><span data-t="k_et0_mm"></span></span><span class="cm-arrow" id="cm-et-dir" aria-hidden="true"></span></li>
          <li class="cmetric tone-amber" data-in style="--i: 7"><span class="cm-ico"><svg><use href="#i-sun"/></svg></span>
            <span class="cm-txt"><b id="cm-hot">–</b><span data-t="clim_hot"></span></span><span class="cm-arrow" id="cm-hot-dir" aria-hidden="true"></span></li>
          <li class="cmetric tone-blue" data-in style="--i: 8"><span class="cm-ico"><svg><use href="#i-wind"/></svg></span>
            <span class="cm-txt"><b id="cm-cold">–</b><span data-t="clim_cold"></span></span><span class="cm-arrow" id="cm-cold-dir" aria-hidden="true"></span></li>
        </ul>
      </section>

      <!-- settings and the main chart -->
      <section class="clim-grid">
        <aside class="dash-panel clim-settings" aria-labelledby="clim-settings-title" data-in style="--i: 6">
          <h2 class="dash-panel-title" id="clim-settings-title"><svg><use href="#i-sliders"/></svg><span data-t="panel_settings"></span></h2>
          <div class="set-row">
            <label for="clim-period"><svg><use href="#i-calendar"/></svg><span data-t="clim_period"></span></label>
            <span class="dash-select"><select id="clim-period"></select><svg class="ico-sm"><use href="#i-chevron"/></svg></span>
          </div>
          <div class="set-row">
            <label for="clim-metric"><svg><use href="#i-layers"/></svg><span data-t="clim_indicator"></span></label>
            <span class="dash-select"><select id="clim-metric"></select><svg class="ico-sm"><use href="#i-chevron"/></svg></span>
          </div>
          <div class="set-row">
            <label for="clim-region"><svg><use href="#i-pin"/></svg><span data-t="clim_region"></span></label>
            <span class="dash-select"><select id="clim-region"></select><svg class="ico-sm"><use href="#i-chevron"/></svg></span>
          </div>
          <button type="button" class="dash-btn dash-btn-primary clim-run" id="clim-run"><svg><use href="#i-arrow"/></svg><span data-t="clim_run"></span></button>
          <p class="clim-settings-note" data-t="clim_settings_note"></p>
        </aside>

        <section class="dash-panel clim-chart-card content" id="content" aria-labelledby="clim-chart-title" data-in style="--i: 7">
          <div class="clim-card-head">
            <h2 class="dash-panel-title" id="clim-chart-title-wrap"><svg><use href="#i-thermo"/></svg><span id="clim-chart-title"></span></h2>
            <div class="clim-legend">
              <span class="lg lg-hist"><i></i><span id="clim-lg-hist"></span></span>
              <span class="lg lg-proj"><i></i><span id="clim-lg-proj"></span></span>
            </div>
          </div>
          <p class="dash-loading" id="dash-loading" role="status" hidden><span class="dash-spinner" aria-hidden="true"></span><span data-t="loading_dash"></span></p>
          <div class="dash-banner" id="dash-banner" role="alert" hidden></div>
          <div class="clim-chart-box"><canvas id="clim-annual" role="img" data-t-aria="clim_chart_aria"></canvas></div>
          <p class="clim-note" data-t="projection_note"></p>
        </section>
      </section>

      <!-- monthly, dryness gauge, findings, advice -->
      <section class="clim-bottom">
        <section class="dash-panel clim-card" aria-labelledby="clim-month-title" data-reveal>
          <h2 class="dash-panel-title" id="clim-month-title"><svg><use href="#i-calendar"/></svg><span data-t="clim_monthly"></span></h2>
          <div class="clim-month-box"><canvas id="clim-monthly" role="img" data-t-aria="clim_monthly"></canvas></div>
          <div class="clim-legend clim-legend-bottom">
            <span class="lg lg-hist"><i></i><span data-t="m_temp"></span></span>
            <span class="lg lg-rain"><i></i><span data-t="m_rain"></span></span>
            <span class="lg-note" id="clim-month-years"></span>
          </div>
        </section>

        <section class="dash-panel clim-card clim-gauge-card" aria-labelledby="clim-gauge-title" data-reveal>
          <h2 class="dash-panel-title" id="clim-gauge-title"><svg><use href="#i-gauge"/></svg><span><span data-t="clim_gauge"></span><small id="clim-gauge-sub"></small></span></h2>
          <div class="clim-gauge" id="clim-gauge">
            <svg class="gauge" viewBox="0 0 220 130" role="img" aria-labelledby="clim-gauge-class">
              <defs>
                <linearGradient id="gauge-grad" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#fb7185"/><stop offset=".35" stop-color="#fbbf24"/><stop offset=".65" stop-color="#a3e635"/><stop offset="1" stop-color="#3ddc84"/>
                </linearGradient>
              </defs>
              <path class="gauge-track" d="M20 115 A90 90 0 0 1 200 115"/>
              <path class="gauge-fill" id="gauge-fill" d="M20 115 A90 90 0 0 1 200 115" pathLength="100"/>
              <g id="gauge-dot"><circle r="7" cx="20" cy="115"/></g>
            </svg>
            <div class="gauge-readout">
              <svg class="gauge-leaf"><use href="#i-leaf"/></svg>
              <b id="clim-gauge-class">–</b>
              <span id="clim-gauge-value">–</span>
            </div>
          </div>
          <p class="clim-gauge-scale"><span data-t="clim_dry"></span><span data-t="clim_wet"></span></p>
        </section>

        <section class="dash-panel clim-card" aria-labelledby="clim-find-title" data-reveal>
          <h2 class="dash-panel-title" id="clim-find-title"><svg><use href="#i-check"/></svg><span data-t="clim_findings"></span></h2>
          <ul class="clim-findings" id="clim-findings"></ul>
          <p class="clim-findings-key" data-t="clim_findings_key"></p>
        </section>

        <section class="dash-panel clim-card clim-advice" aria-labelledby="clim-advice-title" data-reveal>
          <h2 class="dash-panel-title" id="clim-advice-title"><svg><use href="#i-leaf"/></svg><span data-t="clim_advice"></span></h2>
          <p class="clim-advice-text" id="clim-advice-text">–</p>
          <p class="clim-advice-why" id="clim-advice-why"></p>
          <button type="button" class="clim-advice-go" id="clim-advice-open" data-t-aria="clim_advice_more"><svg><use href="#i-arrow"/></svg></button>
        </section>
      </section>
    </main>

    <dialog id="clim-advice-dialog" class="dash-dialog clim-advice-dialog" aria-labelledby="clim-advice-dialog-title">
      <div class="dash-dialog-head">
        <h2 id="clim-advice-dialog-title" data-t="clim_advice_all"></h2>
        <button type="button" class="dash-close" data-close-dialog data-t-aria="close">&times;</button>
      </div>
      <ul class="dash-advice clim-advice-list" id="advice-climate"></ul>
      <a class="dash-link" href="/crops.html"><span data-t="clim_to_crops"></span><svg><use href="#i-arrow"/></svg></a>
    </dialog>
  </div>

  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/i18n.js?v=20261116"></script>
  <script src="/app.js?v=20261116"></script>
  <script src="/field.js?v=20261116"></script>
</body>
</html>
